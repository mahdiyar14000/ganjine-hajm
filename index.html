<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 گنجینه حجم</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🏆 گنجینه حجم</h1>

    <h2>با خانم هراتی</h2>

    <div id="startPage">

        <p class="welcome">

            به بازی آموزشی حجم خوش آمدی.

        </p>

        <input
            id="playerName"
            type="text"
            placeholder="نام خود را وارد کن">

        <br>

        <button id="startBtn">

            شروع بازی

        </button>

    </div>


    <div id="gamePage" style="display:none;">

        <h3 id="helloStudent"></h3>

        <div class="teacherBox">

            👩‍🏫 خانم هراتی:

            <br><br>

            به گنجینه حجم خوش آمدی.

            به سؤال‌ها پاسخ بده و ستاره جمع کن.

        </div>

        <div id="questionBox">

        </div>

        <div id="answerBox">

        </div>

        <div class="scoreBox">

            ⭐ امتیاز :

            <span id="score">

                0

            </span>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
